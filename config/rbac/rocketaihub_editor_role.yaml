# permissions for end users to edit rocketaihubs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: rocketaihub-operator
    app.kubernetes.io/managed-by: kustomize
  name: rocketaihub-editor-role
rules:
- apiGroups:
  - operator.ibm.com
  resources:
  - rocketaihubs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operator.ibm.com
  resources:
  - rocketaihubs/status
  verbs:
  - get
