name: Build and push images

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

env:
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
  REGISTRY_ORG: ${{ vars.REGISTRY_ORG }}

jobs:
  build:
    name: Build the operator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ vars.REGISTRY_HOST }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Build and push operator image with Buildx
      - name: Build and push operator image
        id: build-and-push-operator-image
        run: make docker-buildx

      # Build and push bundle image with Buildx
      - name: Build and push bundle image
        id: build-and-push-bundle-image
        run: make bundle-buildx

      # Build and push catalog image with Buildx
      - name: Build and push catalog image
        id: build-and-push-catalog-image
        run: make catalog-buildx